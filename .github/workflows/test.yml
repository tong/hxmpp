name: test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.haxe == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        haxe:
          - latest
          - 4.3.7
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install haxe ${{ matrix.haxe }}
        uses: krdlab/setup-haxe@v2.1.1
        with:
          haxe-version: ${{ matrix.haxe }}
      - run: haxe --version
      - name: Install haxelibs
        run: |
          haxelib git sasl https://github.com/tong/hxsasl
          haxelib dev hxmpp .
          haxelib install test.hxml --always
          haxelib install hxcpp
          haxelib install hxjava
          haxelib install hxnodejs
          haxelib git utest https://github.com/haxe-utest/utest
      - name: Run unit tests
        run: haxe test.hxml
      - name: Build unit tests (hl)
        run: haxe --cwd test build-hl.hxml
      - name: Run unit tests (jvm)
        run: haxe --cwd test build-jvm.hxml && java -jar test/bin/unit.jvm.jar
      - name: Build unit tests (lua)
        run: haxe --cwd test build-lua.hxml
      - name: Run unit tests (neko)
        run: haxe --cwd test build-neko.hxml && neko test/bin/unit.n
      - name: Run unit tests (nodejs)
        run: haxe --cwd test build-nodejs.hxml && node test/bin/unit.node.js
      - name: Run unit tests (php)
        # xdebug.mode=off: xdebug aborts the jingle file transfer test at 256 stack frames
        run: haxe --cwd test build-php.hxml && php -d xdebug.mode=off test/bin/php/unit.php
      - name: Run unit tests (python)
        run: haxe --cwd test build-python.hxml && python3 test/bin/unit.py
      - name: Run unit tests (cpp)
        run: haxe --cwd test build-cpp.hxml && test/bin/unit
      - name: Build haxedoc.xml
        run: haxe haxedoc.hxml
      # - name: Build example [node]
      #   run: haxe --cwd example node.hxml
      # - name: Build example [hl]
      #   run: haxe --cwd example hl.hxml
